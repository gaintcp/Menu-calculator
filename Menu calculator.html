<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หารบิล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap">
<style>
:root{--bg:#f6f1ef;--card:#fffdfc;--ink:#2a1a1e;--mute:#7a6368;--line:#e3d6d4;--teal:#6d1a2b;--teal-l:#f4e6e7;--amber:#c9a24a;--amber-ink:#2a1e00;--red:#b3261e;--green:#2e7d32;--green-l:#e3f1e4;--on:#6d1a2b;--on-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170b0f;--card:#26131a;--ink:#f3e9ea;--mute:#c4a9ae;--line:#43242d;--teal:#e9b9c1;--teal-l:#3a1b25;--amber:#d4af5a;--amber-ink:#2b1f00;--red:#ff9a8a;--green:#8fdc96;--green-l:#1f3a26;--on:#a3293f;--on-ink:#fff}}
:root[data-theme="dark"]{--bg:#170b0f;--card:#26131a;--ink:#f3e9ea;--mute:#c4a9ae;--line:#43242d;--teal:#e9b9c1;--teal-l:#3a1b25;--amber:#d4af5a;--amber-ink:#2b1f00;--red:#ff9a8a;--green:#8fdc96;--green-l:#1f3a26;--on:#a3293f;--on-ink:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 56px}
h1{font:700 34px/1.15 "Playfair Display","Noto Sans Thai",serif;margin:0;color:#f1d89a;letter-spacing:.01em}
h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:12px;color:var(--teal)}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--amber),transparent)}
.top{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;padding:24px 22px 26px;border-radius:18px;background:linear-gradient(135deg,#3f0b18,#7a2033);border:1px solid #c9a24a;box-shadow:inset 0 0 0 4px #3f0b18,inset 0 0 0 5px #c9a24a80}
.top>div,.top button{position:relative;z-index:1}
.orn{position:absolute;right:64px;bottom:0;width:122px;opacity:.9;pointer-events:none}
@media (max-width:520px){.orn{opacity:.2;right:6px}}
.top p{margin:6px 0 0;color:#ecd5d8;font-size:14px}
.top button{background:transparent;color:#f1d89a;border-color:#c9a24a99}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--teal-l);border-radius:12px;padding:10px 14px}
.kpi small{display:block;color:var(--mute);font-size:13px}
.kpi b{font:700 27px/1.3 "Playfair Display",serif;color:var(--teal);font-variant-numeric:lining-nums tabular-nums}
.kpi.un b{color:var(--red)}.kpi.done b{color:var(--green)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
.grow{flex:1 1 140px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
button.pri{background:var(--on);color:var(--on-ink);border-color:var(--on);font-weight:500}
button.ghost{border-style:dashed;color:var(--mute);width:100%;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;border-radius:99px;background:var(--teal-l);color:var(--teal);font-weight:500}
.chip button{border:0;background:none;padding:0 6px;color:var(--mute);font-size:18px;line-height:1}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0;padding-top:0}
.item .name{flex:2 1 140px}.item .price{flex:1 1 90px;max-width:130px;text-align:right}
.who{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.who button{border-radius:99px;padding:4px 13px;font-size:14px}
.who button[aria-pressed=true]{background:var(--on);color:var(--on-ink);border-color:var(--on)}
.who .all{border-style:dashed;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin-left:auto}
.set{display:grid;grid-template-columns:1fr auto auto;gap:10px 12px;align-items:center}
.set label{display:flex;gap:8px;align-items:center}
.set input[type=number]{width:76px;text-align:right}
.set input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal)}
.set.off .rate{opacity:.4}
.receipts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:6px 6px 0 0;padding:14px 14px 0;position:relative;
-webkit-mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) bottom/14px 100% repeat-x;mask:radial-gradient(circle 7px at 50% 100%,#0000 98%,#000) bottom/14px 100% repeat-x;padding-bottom:20px}
.rc h3{margin:0 0 6px;font-size:17px;color:var(--teal)}
.rc dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.rc dd{margin:0;text-align:right}
.rc .tot{border-top:2px dashed var(--line);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;align-items:baseline}
.rc .tot b{font:700 33px/1.2 "Playfair Display",serif;font-variant-numeric:lining-nums tabular-nums}
.rc.paid{background:var(--green-l)}.rc.paid .tot b{color:var(--green);text-decoration:line-through}
.rc .pay{width:100%;margin-top:10px;background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.rc.paid .pay{background:var(--green);border-color:var(--green);color:#fff}
.empty{color:var(--mute);margin:0}
.reset{display:flex;justify-content:center;margin-top:22px}
.reset button{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700;padding:12px 24px;font-size:17px}
.reset button.sure{background:var(--red);border-color:var(--red);color:#fff}
.note{text-align:center;color:var(--mute);font-size:13px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.rc{transition:background .2s}}
</style>
</head>
<body>
<main>
 <div class="top"><div><h1>หารบิล</h1><p>แต่ละคนจ่าย Service Charge และ VAT ตามอาหารที่กินจริง</p></div>
 <svg class="orn" viewBox="0 0 120 90" fill="none" stroke="#d9b863" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M14 66A46 46 0 0 1 106 66"/><path d="M6 66H114M16 74H104"/><circle cx="60" cy="15" r="4"/><path d="M60 19v1M30 54A32 32 0 0 1 46 37"/><path d="M40 84c3-3 3-6 0-9M60 84c3-3 3-6 0-9M80 84c3-3 3-6 0-9" opacity=".6"/></svg><button id="theme" aria-label="สลับโหมดสว่าง/มืด">◐</button></div>
 <div class="kpis"><div class="kpi"><small>ยอดบิลรวม</small><b id="kTotal">0</b></div><div class="kpi un" id="kUn"><small>ยังไม่จ่าย</small><b id="kUnpaid">0</b></div></div>

 <section><h2>ใครมาบ้าง</h2>
  <div class="row" id="people"></div>
  <form class="row" id="pform" style="margin-top:10px"><input class="grow" type="text" id="pname" placeholder="ชื่อ เช่น Lisa" autocomplete="off"><button class="pri" type="submit">เพิ่มคน</button></form></section>

 <section><h2>เมนูที่สั่ง</h2><div id="items"></div>
  <button class="ghost" id="addItem">+ เพิ่มเมนู</button></section>

 <section><h2>Service Charge และ VAT</h2>
  <div class="set" id="set">
   <label><input type="checkbox" id="scOn"> Service Charge</label><span class="rate" id="scR"><input type="number" id="sc" min="0" step="0.5" inputmode="decimal"> %</span><span></span>
   <label><input type="checkbox" id="vatOn"> VAT</label><span class="rate" id="vatR"><input type="number" id="vat" min="0" step="0.5" inputmode="decimal"> %</span><span></span>
   <label style="grid-column:1/-1"><input type="checkbox" id="vOnS"> VAT คิดรวม Service Charge (คิดบนยอดหลังบวก Service Charge)</label>
  </div></section>

 <section><h2>ยอดที่ต้องจ่าย</h2><div class="receipts" id="rec"></div></section>

 <div class="reset"><button id="reset">Payment Success · ล้างข้อมูลบิลนี้</button></div>
 <p class="note">ล้างเมนู ชื่อคน และสถานะจ่ายแล้ว แต่เก็บอัตรา Service Charge และ VAT ไว้ใช้ครั้งถัดไป</p>
</main>
<script>
const KEY="splitbill.v1";
const def=()=>({people:[],items:[],paid:{},sc:10,vat:7,scOn:true,vatOn:true,vOnS:true});
let S=def(),uid=1;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
S.uid=S.uid||Math.max(0,...S.people.map(p=>p.id),...S.items.map(i=>i.id))+1;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fmt=(n,d=0)=>n.toLocaleString("th-TH",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function calc(){
 const sc=S.scOn?(+S.sc||0)/100:0,vat=S.vatOn?(+S.vat||0)/100:0,out={};
 S.people.forEach(p=>out[p.id]={food:0});
 S.items.forEach(it=>{const w=it.who.filter(id=>out[id]);if(!w.length)return;w.forEach(id=>out[id].food+=(+it.price||0)/w.length)});
 let T=0;
 S.people.forEach(p=>{const o=out[p.id];o.sc=o.food*sc;o.vat=(o.food+(S.vOnS?o.sc:0))*vat;o.sum=o.food+o.sc+o.vat;o.pay=Math.round(o.sum);T+=o.sum});
 return{out,T}
}
function render(){
 $("people").innerHTML=S.people.length?S.people.map(p=>`<span class="chip">${esc(p.name)}<button data-del-p="${p.id}" aria-label="ลบ ${esc(p.name)}">×</button></span>`).join(""):'<p class="empty">เริ่มจากเพิ่มชื่อคนที่มากินด้วยกัน</p>';
 $("items").innerHTML=S.items.length?S.items.map(it=>`<div class="item" data-id="${it.id}">
  <div class="row"><input class="name" type="text" data-f="name" value="${esc(it.name)}" placeholder="ชื่อเมนู" aria-label="ชื่อเมนู">
  <input class="price" type="number" data-f="price" value="${it.price===""?"":it.price}" placeholder="ราคา" min="0" step="any" inputmode="decimal" aria-label="ราคา"><button data-del-i="${it.id}" aria-label="ลบเมนู">×</button></div>
  <div class="who">${S.people.map(p=>`<button data-tg="${p.id}" aria-pressed="${it.who.includes(p.id)}">${esc(p.name)}</button>`).join("")}${S.people.length>1?'<button class="all" data-all="1">ทุกคน</button>':""}<span class="hint" data-hint></span></div></div>`).join(""):'<p class="empty">ยังไม่มีเมนู กด “เพิ่มเมนู” แล้วเลือกว่าใครกิน</p>';
 $("scOn").checked=S.scOn;$("vatOn").checked=S.vatOn;$("vOnS").checked=S.vOnS;$("sc").value=S.sc;$("vat").value=S.vat;
 $("scR").style.opacity=S.scOn?1:.4;$("vatR").style.opacity=S.vatOn?1:.4;
 summary()
}
function summary(){
 const{out,T}=calc();
 document.querySelectorAll(".item").forEach(el=>{const it=S.items.find(i=>i.id==el.dataset.id),n=it.who.length,h=el.querySelector("[data-hint]");
  h.textContent=n?`หาร ${n} คน · คนละ ${fmt((+it.price||0)/n,2)}`:"ยังไม่เลือกคนกิน"});
 let un=0;
 $("rec").innerHTML=S.people.length?S.people.map(p=>{const o=out[p.id],pd=S.paid[p.id];if(!pd)un+=o.pay;
  return`<div class="rc${pd?" paid":""}"><h3>${esc(p.name)}</h3><dl><dt>ค่าอาหาร</dt><dd>${fmt(o.food,2)}</dd>${S.scOn?`<dt>Service Charge</dt><dd>${fmt(o.sc,2)}</dd>`:""}${S.vatOn?`<dt>VAT</dt><dd>${fmt(o.vat,2)}</dd>`:""}</dl>
  <div class="tot"><span>ต้องจ่าย</span><b>${fmt(o.pay)}</b></div><button class="pay" data-pay="${p.id}">${pd?"จ่ายแล้ว ✓ (กดเพื่อยกเลิก)":"ทำเครื่องหมายว่าจ่ายแล้ว"}</button></div>`}).join(""):'<p class="empty">ยอดของแต่ละคนจะแสดงที่นี่</p>';
 $("kTotal").textContent=fmt(T,2);$("kUnpaid").textContent=fmt(un);$("kUn").classList.toggle("done",T>0&&un===0);
 save()
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 const d=t.dataset,itEl=t.closest(".item"),it=itEl&&S.items.find(i=>i.id==itEl.dataset.id);
 if(d.delP){S.people=S.people.filter(p=>p.id!=d.delP);S.items.forEach(i=>i.who=i.who.filter(x=>x!=d.delP));render()}
 else if(d.delI){S.items=S.items.filter(i=>i.id!=d.delI);render()}
 else if(d.tg){const id=+d.tg;it.who=it.who.includes(id)?it.who.filter(x=>x!==id):[...it.who,id];t.setAttribute("aria-pressed",it.who.includes(id));summary()}
 else if(d.all){it.who=S.people.map(p=>p.id);render()}
 else if(d.pay){S.paid[d.pay]=!S.paid[d.pay];summary()}
 else if(t.id==="addItem"){S.items.push({id:S.uid++,name:"",price:"",who:[]});render();const n=document.querySelectorAll(".item .name");n[n.length-1].focus()}
 else if(t.id==="theme"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"}
 else if(t.id==="reset"){if(t.classList.contains("sure")){S.people=[];S.items=[];S.paid={};t.classList.remove("sure");t.textContent="Payment Success · ล้างข้อมูลบิลนี้";render()}
  else{t.classList.add("sure");t.textContent="กดอีกครั้งเพื่อยืนยันการล้างข้อมูล";setTimeout(()=>{t.classList.remove("sure");t.textContent="Payment Success · ล้างข้อมูลบิลนี้"},4000)}}
});
document.addEventListener("input",e=>{
 const el=e.target,itEl=el.closest(".item");
 if(itEl){const it=S.items.find(i=>i.id==itEl.dataset.id);it[el.dataset.f]=el.dataset.f==="price"?(el.value===""?"":+el.value):el.value;summary()}
 else if(el.id==="sc"||el.id==="vat"){S[el.id]=el.value===""?0:+el.value;summary()}
});
document.addEventListener("change",e=>{const el=e.target;if(["scOn","vatOn","vOnS"].includes(el.id)){S[el.id]=el.checked;render()}});
$("pform").addEventListener("submit",e=>{e.preventDefault();const v=$("pname").value.trim();if(!v)return;S.people.push({id:S.uid++,name:v});$("pname").value="";render();$("pname").focus()});
render();
</script>
</body>
</html>
